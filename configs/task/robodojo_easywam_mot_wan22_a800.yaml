# @package _global_
# Full Video/Action DiT fine-tuning; frozen VAE/text encoder, no LoRA.
# Start with CPU optimizer offload on one A800 80GB; capacity is unverified.
defaults:
  - robodojo_easywam_mot_wan22
  - _self_

batch_size: 10
num_workers: 0
dataloader_pin_memory: false
gradient_accumulation_steps: 2
vae_micro_batch_size: null
mixed_precision: bf16
model:
  backbone:
    use_gradient_checkpointing: false
log_every: 10
max_steps: 200000
save_every_epochs: 1
checkpoint_save_limit: 3
