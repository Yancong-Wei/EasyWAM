# @package _global_
# Single-GPU 48GB recipe for Wan2.2 MoT LoRA. Default *_lora.yaml assumes 8xH100.

defaults:
  - override /data: libero_2cam
  - override /model: easywam_mot_wan22_lora
  - _self_

batch_size: 1
num_workers: 4
dataloader_prefetch_factor: 2

lr_scheduler_type: cosine
learning_rate: 1e-4
# Official 8xH100 LoRA uses 20000 steps at global batch 128 (~9.2 epochs).
# max_epochs sets the data budget; trainer derives max_steps from global batch.
max_epochs: 1
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
eval_num_inference_steps: 10
eval_save_video: false

gradient_accumulation_steps: 8
weight_decay: 1e-2
mixed_precision: bf16
vae_micro_batch_size: 1
resume: null

model:
  backbone:
    use_gradient_checkpointing: true
    attention_backend: auto
